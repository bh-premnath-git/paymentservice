services:
  payment-service:
    build:
      context: .
      dockerfile: ./app/Dockerfile
      target: development
    ports:
      - "8003:8000" # FastAPI HTTP
      - "50051:50051" # gRPC
    env_file:
      - .env
    environment:
      - ENVIRONMENT=${ENVIRONMENT}
      - DATABASE_URL=postgresql+asyncpg://payment:payment@host.docker.internal:5432/payment_db
      - REQUESTOR_BASE_URL=${REQUESTOR_BASE_URL}
      - REQUESTOR_MODE=${REQUESTOR_MODE}
      - STRIPE_SECRET_KEY=${STRIPE_SECRET_KEY}
      - JWT_SECRET_KEY=${JWT_SECRET_KEY}
      - LOG_LEVEL=${LOG_LEVEL}
      - REDIS_URL=redis://host.docker.internal:6379/0
      - ENABLE_MTLS=${ENABLE_MTLS}
      - ENABLE_AUTH_INTERCEPTOR=${ENABLE_AUTH_INTERCEPTOR}
      # Keycloak configuration for external service
      - KEYCLOAK_ISSUER=http://host.docker.internal:8080/realms/finstack
      - KEYCLOAK_AUDIENCE=paymentservice
      - KEYCLOAK_JWKS_URL=http://host.docker.internal:8080/realms/finstack/protocol/openid-connect/certs
      # Consul configuration for external service
      - CONSUL_URL=http://host.docker.internal:8500
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - payment-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  requestor-mock:
    build:
      context: .
      dockerfile: ./sandbox/requestor_mock/Dockerfile
    ports:
      - "8004:8001"
    env_file:
      - .env
    environment:
      - ENVIRONMENT=${ENVIRONMENT}
      - LOG_LEVEL=${LOG_LEVEL}
    depends_on:
      payment-service:
        condition: service_healthy
    networks:
      - payment-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8001/health"]
      interval: 30s
      timeout: 5s
      retries: 3

  # Removed postgres and redis services - using external containers

  grpcui:
    image: fullstorydev/grpcui:latest
    ports:
      - "8005:8080"
    command:
      - -plaintext
      - -bind=0.0.0.0
      - -port=8080
      - payment-service:50051
    depends_on:
      payment-service:
        condition: service_healthy
    networks:
      - payment-network
    profiles:
      - tools

# Removed volumes for postgres and redis - using external containers

networks:
  payment-network:
    driver: bridge
